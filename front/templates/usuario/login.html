<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Snapshop</title>
    <link rel="stylesheet" href="/front/style/cadastro/cadastroStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
                :root{
            --primaria: #FFD166;
            --hover: #e6b84f;
            --herobtn: #494949;
            --herohover: #292929;
            --fundo: #FFF8E7;
        }
    </style>
    <link rel="stylesheet" href="/front/style/responsividadeGeral.css">
</head>
<body>

    <main class="container">
        <img src="/front/icons/logosnap.png" alt="Logo Snapshop" class="logo-login">

        <div class="box">
            

            <h1>Login</h1>

            <form id="formulario" method="POST" action="/Login">

                <label>Email:</label>
                <input type="text" id="email" name="Email">
                <p id="erro-email"></p>

                <label>Senha:</label>
                <div class="senha-wrapper">
                    <input type="password" id="senha" name="Senha">
                    <button type="button" class="toggle-senha" data-target="senha">
                        <i class="fas fa-eye icone-olho"></i>
                    </button>
                </div>
                <p id="erro-senha"></p>

                <button type="submit">Entrar</button>
            </form>

            <a href="/">
                <button id="voltar">Voltar</button>
            </a>

        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/front/script/togglePassword.js"></script>
    <script src="/front/script/usuario/login.js"></script>
</body>
</html>
