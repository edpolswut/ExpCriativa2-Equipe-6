<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - {{ loja.Nome }}</title>
    <link rel="stylesheet" href="/front/style/global.css">
    <link rel="stylesheet" href="/front/style/cadastro.css">
    <link rel="stylesheet" href="/front/style/loja/mainpage.css">
    <link rel="stylesheet" href="/front/style/headerStyle.css">
    <link rel="stylesheet" href="/front/style/responsividadeGeral.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --cor-primaria-loja: {{ loja.Cor_Principal if loja and loja.Cor_Principal else '#0b3d91' }};
            --cor-secundaria-loja: {{ loja.Cor_Secundaria if loja and loja.Cor_Secundaria else '#FFD166' }};
        }
        .cadastro-container {
            background-color: var(--cor-primaria-loja);
        }
        .cadastro-form button {
            background-color: var(--cor-primaria-loja);
        }
        .cadastro-form button:hover {
            background-color: var(--cor-secundaria-loja);
        }
        .cadastro-form a {
            color: var(--cor-primaria-loja);
        }
    </style>
</head>
<body style="--azul: {% if loja and loja.Cor_Principal %}{{ loja.Cor_Principal }}{% else %}#0b3d91{% endif %}; --amarelo: {% if loja and loja.Cor_Secundaria %}{{ loja.Cor_Secundaria }}{% else %}#ffd700{% endif %};">
    {% include 'header/headerloja.html' %}

    <main>
        <div class="cadastro-container">
            <div class="cadastro-header">
                <h2>Crie sua conta em {{ loja.Nome }}</h2>
                <p>É rápido e fácil.</p>
            </div>
            <form id="formulario" class="cadastro-form" method="POST" action="/loja/{{ identificador }}/cadastro">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="Nome" placeholder="Seu nome completo" required>
                    <span class="error-message" id="erro-nome"></span>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="CPF" placeholder="000.000.000-00" required maxlength="14">
                    <span class="error-message" id="erro-cpf"></span>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="Email" placeholder="seu@email.com" required>
                    <span class="error-message" id="erro-email"></span>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-input-container">
                        <input type="password" id="senha" name="Senha" placeholder="Crie uma senha forte" required>
                        <button type="button" class="toggle-senha" data-target="senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="erro-senha"></span>
                </div>
                <div class="form-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <div class="password-input-container">
                        <input type="password" id="confirmarSenha" name="ConfirmarSenha" placeholder="Confirme sua senha" required>
                        <button type="button" class="toggle-senha" data-target="confirmarSenha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="erro-confirmar-senha"></span>
                </div>
                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento</label>
                    <input type="date" id="dataNascimento" name="DataNascimento" required>
                    <span class="error-message" id="erro-data"></span>
                </div>
                <button type="submit">Cadastrar</button>
                <p class="login-link">Já tem uma conta? <a href="/loja/{{ identificador }}/login">Faça login aqui</a></p>
            </form>
        </div>
    </main>

    {% include 'footer/footer.html' %}
    <script src="/front/script/loja/cadastro.js"></script>
</body>
</html>
