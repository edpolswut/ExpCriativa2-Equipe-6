<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - {{ loja.Nome }}</title>
    <link rel="stylesheet" href="/front/style/cadastro/cadastroStyle.css">
    <link rel="stylesheet" href="/front/style/responsividadeGeral.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primaria: {{ loja.Cor_Principal if loja and loja.Cor_Principal else '#0b3d91' }};
            --secundaria: {{ loja.Cor_Secundaria if loja and loja.Cor_Secundaria else '#ffd700' }};
            --fundo: linear-gradient(135deg, var(--primaria) 0%, var(--secundaria) 100%);
            --hover: {{ loja.Cor_Secundaria if loja and loja.Cor_Secundaria else '#ffd700' }};
        }
        .box {
            border-top: 5px solid var(--primaria);
        }
        #voltar{
            background: transparent;
            color: black;
            border: 2px solid black;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <main class="container">
        {% if loja and loja.Logo_B64 %}
            <img src="data:image/jpeg;base64,{{ loja.Logo_B64 }}" alt="Logo {{ loja.Nome }}" class="logo-login" style="max-height: 80px; object-fit: contain;">
        {% else %}
            <h1 style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">{{ loja.Nome }}</h1>
        {% endif %}

        <div class="box">
            <h1>Criar Conta</h1>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Bem-vindo à {{ loja.Nome }}</p>
            <p style="text-align: center; font-size: 0.85rem; color: #777; margin-top: -15px; margin-bottom: 20px;">Você também pode utilizar sua conta <strong>Snapshop</strong>.</p>

            <form id="formulario" method="POST" action="/loja/{{ identificador }}/cadastro">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="Nome" value="{{ Nome or '' }}" required>
                <p id="erro-nome"></p>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="CPF" value="{{ CPF or '' }}" placeholder="000.000.000-00" required maxlength="14">
                <p id="erro-cpf"></p>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="Email" value="{{ Email or '' }}" required>
                <p id="erro-email"></p>

                <label for="senha">Senha:</label>
                <div class="senha-wrapper">
                    <input type="password" id="senha" name="Senha" required>
                    <button type="button" class="toggle-senha" data-target="senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p id="erro-senha"></p>

                <label for="confirmarSenha">Confirmar Senha:</label>
                <div class="senha-wrapper">
                    <input type="password" id="confirmarSenha" name="ConfirmarSenha" required>
                    <button type="button" class="toggle-senha" data-target="confirmarSenha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p id="erro-confirmar-senha"></p>

                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="DataNascimento" value="{{ DataNascimento or '' }}" required>
                <p id="erro-data"></p>

                <button type="submit">Cadastrar</button>
            </form>
            
            <button id="voltar" type="button" onclick="window.location.href='/loja/{{ identificador }}/login'">Voltar para o Login</button>
        </div>
    </main>

    <script src="/front/script/togglePassword.js"></script>
    <script src="/front/script/loja/cadastro.js"></script>
    <script>
        // Aciona o SweetAlert se o servidor retornou erro via contexto
        {% if erro %}
            const erroLoja = "{{ erro }}";
            if (erroLoja === 'email_existe') Swal.fire('Atenção', 'Este e-mail já está cadastrado nesta loja!', 'error');
            else if (erroLoja === 'cpf_existe') Swal.fire('Atenção', 'Este CPF já está cadastrado em nosso sistema!', 'error');
            else if (erroLoja === 'sistema') Swal.fire('Erro', 'Ocorreu um erro no sistema.', 'error');
        {% endif %}
    </script>
</body>
</html>
