<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - SnapShop</title>
    <link rel="stylesheet" href="/front/style/headerStyle.css">
    <link rel="stylesheet" href="/front/style/perfilStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
                :root{
            --primaria: #FFD166;
            --hover: #e6b84f;
            --herobtn: #494949;
            --herohover: #292929;
            --fundo: #FFF8E7;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="left">
            <a href="/" class="logo">Snap<span class="shop">shop</span></a>
        </div>
        <div class="center">
            <a href="/" class="nav-btn">Sobre</a>
            <a href="/" class="nav-btn">Contato</a>
        </div>
        <div class="right">
            <a href="/logout" class="nav-btn"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </header>

    <main>
        <section class="perfil-section">
            <div class="perfil-box" style="flex-direction: column; align-items: stretch;">
                <div id="info-perfil-atual" style="display: flex; align-items: center; gap: 20px;">
                    <div class="perfil-avatar" id="perfilAvatar">{{ usuario.Nome[0] }}</div>
                    <div class="perfil-info">
                        <h1 id="nomeUsuario" data-nome="{{ usuario.Nome }}">{{ usuario.Nome }}</h1>
                        <span>{{ usuario.Email }}</span>
                        <br>
                        <button onclick="toggleEdicaoPerfil()" style="background: none; border: none; font-size: 13px; color: #494949; text-decoration: underline; cursor: pointer; padding: 0;">
                            <i class="fas fa-user-edit"></i> Editar Perfil
                        </button>
                    </div>
                    <a href="/CadastroLoja" class="cta-btn" style="margin-left: auto;"><i class="fas fa-plus"></i> Criar loja</a>
                </div>

                <div id="form-edicao-perfil" style="display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                    <form action="/SalvarEdicaoUsuario" method="POST">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="campo-grupo" style="display: flex; flex-direction: column;">
                                <label style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Nome:</label>
                                <input type="text" name="Nome" value="{{ usuario.Nome }}" required style="padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
                            </div>
                            <div class="campo-grupo" style="display: flex; flex-direction: column;">
                                <label style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Email:</label>
                                <input type="email" name="Email" value="{{ usuario.Email }}" required style="padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
                            </div>
                            <div class="campo-grupo" style="display: flex; flex-direction: column; grid-column: span 2;">
                                <label style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Nova Senha (deixe vazio para manter):</label>
                                <input type="password" name="Senha" style="padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
                            </div>
                        </div>
                        
                        <div style="margin-top: 20px; display: flex; gap: 10px;">
                            <button type="submit" class="cta-btn pequeno">Guardar Alterações</button>
                            <button type="button" class="cta-btn pequeno" style="background: #666;" onclick="toggleEdicaoPerfil()">Cancelar</button>
                            <button type="button" onclick="confirmarExclusao()" style="background: none; border: 1px solid #d93025; color: #d93025; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s;" onmouseover="this.style.background='#d93025'; this.style.color='white'" onmouseout="this.style.background='none'; this.style.color='#d93025'">
                                <i class="fas fa-trash-alt"></i> Eliminar Minha Conta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="showcase">
            <h2>Minhas Lojas</h2>
            
            {% if lojas %}
            <div class="lojas-grid">
                {% for loja in lojas %}
                <div class="card" style="padding-bottom: 20px;">
                    <div class="card-img" style="display: flex; align-items: center; justify-content: center; background: #eee;">
                        <i class="fas fa-store fa-3x" style="color: #ccc;"></i>
                    </div>
                    <div class="card-title">
                        {{ loja.Nome }} <br>
                        <span style="font-weight: normal; font-size: 13px; color: #666;">CNPJ: {{ loja.Cnpj }}</span>
                    </div>
                    <a href="/EditarLoja/{{ loja.Id_Loja }}" class="cta-btn pequeno"><i class="fas fa-cog"></i> Gerenciar</a>
                </div>
                {% endfor %}
            </div>
            {% else %}
                <p>Você ainda não possui nenhuma loja.</p>
            {% endif %}
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/front/script/perfilJS.js"></script>
</body>
</html>
