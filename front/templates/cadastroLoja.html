<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Loja</title>
    <link rel="stylesheet" href="/front/style/cadastro/cadastroStyle.css">
</head>
<body>

    <main class="container">
        <div class="box">

            <h1>Comece sua loja</h1>

            <form id="formulario" method="POST" action="/CriarLoja">
                <label for="nomeLoja">Nome da Loja:</label>
                <input type="text" id="nomeLoja" name="NomeLoja">
                <p id="erro-nomeLoja" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <label for="emailLoja">Email da Loja:</label>
                <input type="text" id="emailLoja" name="EmailLoja">
                <p id="erro-emailLoja" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="CNPJ">
                <p id="erro-cnpj" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="Telefone">
                <p id="erro-telefone" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <hr>
                <h3>Endereço</h3>
                <br>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="CEP">
                <p id="erro-cep" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <label for="logradouro">Rua/Logradouro:</label>
                <input type="text" id="logradouro" name="Logradouro">
                <p id="erro-logradouro" style="color: red; font-size: 14px; margin-top: 0;"></p>

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="numero">Número:</label>
                        <input type="number" id="numero" name="Numero" required>
                    </div>
                    <div style="flex: 2;">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="Complemento">
                    </div>
                </div>

                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="Bairro" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="Cidade" required>

                <button type="submit">Cadastrar Loja</button>
            </form>

            <a href="/perfilLojista"> <button id="voltar" type="button">Voltar</button>
            </a>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/front/script/cadastro/cadastroLoja.js"></script>
</body>
</html>
