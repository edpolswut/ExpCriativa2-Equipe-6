<header class="site-header">
    <div class="header-container">
        
        <div class="logo" style="display: flex; align-items: center; gap: 12px; font-size: 20px;">
            {% if loja and loja.Logo_B64 %}
                <img src="data:image/jpeg;base64,{{ loja.Logo_B64 }}" alt="Logo" style="height: 60px; border-radius: 8px; object-fit: cover;">
            {% endif %}
            <span>{{ loja.Nome if loja else 'Nossa Loja' }}</span>
        </div>

        <div class="search-container">
            <form action="/loja/{{ loja.Url if loja.Url else loja.Id_Loja }}" method="GET" class="search-form">
                {% for cat in categorias_selecionadas %}
                    <input type="hidden" name="categorias" value="{{ cat }}">
                {% endfor %}
                {% if preco_selecionado %}
                    <input type="hidden" name="preco" value="{{ preco_selecionado }}">
                {% endif %}
                
                <input type="text" name="busca" id="input-pesquisa-header" class="search-input" placeholder="Buscar produtos..." value="{{ busca_atual if busca_atual else '' }}">
                
                <button type="submit" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="/loja/{{ loja.Url if loja.Url else loja.Id_Loja }}">Início</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </div>
</header>
