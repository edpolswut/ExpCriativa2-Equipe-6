<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Configurações da Loja - SnapShop</title>

    <link rel="stylesheet" href="/front/style/headerStyle.css">
    <link rel="stylesheet" href="/front/style/perfilStyle.css">
    <link rel="stylesheet" href="/front/style/editarLojaStyle.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
                :root{
            --primaria: #FFD166;
            --hover: #e6b84f;
            --herobtn: #494949;
            --herohover: #292929;
            --fundo: #FFF8E7;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="left">
            <a href="/" class="logo">Snap<span class="shop">shop</span></a>
        </div>

        <div class="center"></div>

        <div class="right">
            <a href="/perfilLojista" class="nav-btn">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
    </header>

    <div class="app-body">
        <nav class="sidebar">
            <h2><i class="fas fa-store"></i> Painel da Loja</h2>

            <a href="/EditarLoja/{{ id_loja }}" class="active">
                <i class="fas fa-sliders-h"></i> Configurações
            </a>

            <a href="/GerenciarProdutos?id_loja={{ id_loja }}">
                <i class="fas fa-box-open"></i> Produtos
            </a>
        </nav>

        <main class="content">
            <form action="/SalvarEdicaoLoja" method="POST" enctype="multipart/form-data">

                <input type="hidden" name="Id_Loja" value="{{ loja.Id_Loja }}">

                <div class="card-painel">
                    <h3 class="secao-titulo">
                        <i class="fas fa-id-card"></i> Dados da Empresa
                    </h3>

                    <div class="grid-campos">
                        <div class="form-group">
                            <label>Nome da Loja</label>
                            <input type="text" name="Nome" value="{{ loja.Nome }}" required>
                        </div>

                        <div class="form-group">
                            <label>Razão Social</label>
                            <input type="text" name="Razao_Social" value="{{ loja.Razao_Social }}" required>
                        </div>

                        <div class="form-group">
                            <label>CNPJ</label>
                            <input type="text" name="Cnpj" value="{{ loja.Cnpj }}" required>
                        </div>

                        <div class="form-group">
                            <label>E-mail Comercial</label>
                            <input type="email" name="Email" value="{{ loja.Email }}" required>
                        </div>

                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" name="Telefone" value="{{ loja.Telefone }}" required>
                        </div>
                    </div>
                </div>

                <div class="card-painel">
                    <h3 class="secao-titulo">
                        <i class="fas fa-map-marker-alt"></i> Localização
                    </h3>

                    <div class="grid-campos">
                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" name="Cep" value="{{ endereco.Cep if endereco else '' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" name="Cidade" value="{{ endereco.Cidade if endereco else '' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" name="Bairro" value="{{ endereco.Bairro if endereco else '' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Rua</label>
                            <input type="text" name="Rua" value="{{ endereco.Rua if endereco else '' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Número</label>
                            <input type="number" name="Numero" value="{{ endereco.Numero if endereco else 0 }}" required>
                        </div>

                        <div class="form-group">
                            <label>Complemento</label>
                            <input type="text" name="Complemento" value="{{ endereco.Complemento if endereco else '' }}">
                        </div>
                    </div>
                </div>

                <div class="card-painel">
                    <h3 class="secao-titulo">
                        <i class="fas fa-paint-brush"></i> Identidade Visual
                    </h3>

                    <div class="grid-campos">
                        <div class="form-group">
                            <label>URL da Loja</label>
                            <input type="text" name="Url" value="{{ config.Url if config else '' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Nome do Tema</label>
                            <input type="text" name="Nom_Tema" value="{{ config.Nom_Tema if config else 'Padrão' }}" required>
                        </div>

                        <div class="form-group">
                            <label>Cor Principal</label>
                            <input type="color" name="Cor_Principal" value="{{ config.Cor_Principal if config else '#FFD166' }}">
                        </div>

                        <div class="form-group">
                            <label>Cor Secundária</label>
                            <input type="color" name="Cor_Secundaria" value="{{ config.Cor_Secundaria if config else '#FFF8E7' }}">
                        </div>
                    </div>

                    <div class="grid-campos">
                        <div class="form-group">
                            <label>Logo</label>
                            <div class="preview-container">
                                <img id="preview-logo" src="{% if config and config.Logo_B64 %}data:image/jpeg;base64,{{ config.Logo_B64 }}{% endif %}" class="img-preview">
                            </div>
                            <input type="file" name="Logo" id="input-logo" accept="image/*">
                        </div>

                        <div class="form-group">
                            <label>Banner</label>
                            <div class="preview-container">
                                <img id="preview-banner" src="{% if config and config.Banner_B64 %}data:image/jpeg;base64,{{ config.Banner_B64 }}{% endif %}" class="img-preview banner-size">
                            </div>
                            <input type="file" name="Banner" id="input-banner" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="btn-area">
                    <button type="submit" class="btn-salvar">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>

            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/front/script/editarLoja.js"></script>
</body>
</html>
