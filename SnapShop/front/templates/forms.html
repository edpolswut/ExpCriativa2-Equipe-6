<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="/front/style/formsstyle.css">
</head>

<body>
    <form id="formulario" action="/CriarUsuario" method="post" enctype="multipart/form-data">
        <h2 class="titulo">Cadastro</h2>
        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="Nome" name="Nome">
            <span class="erro" id="erro-nome"></span>
        </div>

        <div class="campo">
            <label for="email">Email:</label>
            <input type="email" id="Email" name="Email">
            <span class="erro" id="erro-email"></span>
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="Senha" name="Senha">
            <span class="erro" id="erro-senha"></span>
        </div>

        <button type="submit">Enviar</button>
    </form>

    <script src="/front/script/formsscript.js"></script>
    
</body>
</html>
