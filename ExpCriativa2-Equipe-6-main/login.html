<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Snapshop</title>
    <link rel="stylesheet" href="/front/style/indexCadastroLoja.css">
</head>
<body>

    <main class="container">
        <div class="box">

            <h1>Login</h1>

            <form id="formulario" method="POST" action="/Login">

                <label>Email:</label>
                <input type="text" id="email" name="Email">
                <p id="erro-email"></p>

                <label>Senha:</label>
                <input type="password" id="senha" name="Senha">
                <p id="erro-senha"></p>

                <button type="submit">Entrar</button>
            </form>

            <a href="/index">
                <button id="voltar">Voltar</button>
            </a>

        </div>
    </main>

    <script src="/front/script/formsscript.js"></script>
</body>
</html>
