<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshop</title>
    <link rel="stylesheet" href="/front/style/indexCadastroLoja.css">
</head>
<body>
    <header>
        <div class="left">
            <button class="logo">SnapShop</button>
        </div>

        <div class="center">
            <button>Sobre</button>
            <button>Contato</button>
        </div>

        <div class="right">
            <a href="/login">
                <button onclick="showLoginModal()">Entrar</button>
            </a>
            <a href="/cadastro">
                <button>Criar conta</button>
            </a>
        </div>
    </header>

    <main>
        <section class="hero">
            <img src="/front/img/logo.png" alt="Banner"/>
        </section>

        <section class="carousel">
            <div class="carousel-container">
                <div class="card">
                    <a href="/mainpage">
                    <img src="/front/img/lendas.png"/>
                    <p>Loja de Brinquedos</p>
                    </a>
                </div>

                <div class="card">
                    <img src="/front/img/randall.png"/>
                    <p>Site de Bet</p>
                </div>

                <div class="card">
                    <img src="/front/img/herois.png"/>
                    <p>PUCPR</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 - Snapshop</p>
    </footer>

    <script src="/front/script/indexscript.js"></script>
</body>
</html>
